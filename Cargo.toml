[package]
name = "gameready"
version = "0.1.1"
description = "GameReady - 一键就绪 · 开局即战"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WebView2 引导小窗（egui 经 eframe re-export 使用：use eframe::egui）
eframe = "0.29"
# WebView2 离线包下载（rustls，避免依赖系统 openssl）
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# Windows API：注册表 / SetFileTime / ShellExecute / IsWow64Process2
winreg = "0.52"
windows = { version = "0.58", features = [
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_Foundation",
] }
# 进程监听
sysinfo = "0.30"
# 文件时间戳（修改/访问时间；创建时间走 windows SetFileTime）
filetime = "0.2"
chrono = "0.4"
# SFTP 备份：纯 Rust SSH，免额外安装客户端或 OpenSSL DLL。
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net"] }
uuid = { version = "1", features = ["v4", "v5"] }
sha2 = "0.10"

[dev-dependencies]
rand = "0.10"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
